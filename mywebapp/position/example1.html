<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* CSS styles.css */
        .firstDiv,
        .secondDiv,
        .thirdDiv {
            height: 200px;
            width: 200px;
        }

        .firstDiv {
            background-color: red;
            position: absolute;
            left: 100px;
            top: 100px;
        }

        .secondDiv {
            background-color: green;
        }

        .thirdDiv {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="firstDiv">
        This is First DIV.
    </div>
    <div class="secondDiv">
        This is Second DIV.
    </div>
    <div class="thirdDiv">
        This is Third DIV.
    </div>
</body>

</html>
