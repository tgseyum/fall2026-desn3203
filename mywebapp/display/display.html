    <title>box model</title>
    <style>

        }
        .parent{
            border: 3px red solid;
            border-top: 3px green solid;
            padding-left: 20px;
            margin: 20px;            
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction:row;
            flex-wrap: wrap;
        }
        .child{
            border: solid blue 2px;            
            padding: 5px;
            margin: 2px;           
            background-image: url(bvclogo.jpg);
            background-size: contain;
            width: 50px;
            height: 40px;
        }
        /* .child1{
            display: none;
        } */
    </style>
</head>
<body>
    <div class="parent">
        <div class="child child1">  </div>
        <div class="child"> </div>
        <div class="child"> </div>
         <div class="child"> </div>
          <div class="child"> </div>
           <div class="child"> </div>
    </div>
    
</body>
</html>
