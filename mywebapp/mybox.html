<!-- HTML Code -->
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>CSS Padding</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* CSS Style sheet */
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: green;
        }

        #myPadding {
            background-color: blue;
            display: inline-block;
            color: red;
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 40px;
            padding-left: 80px;
        }
    </style>
</head>

<body>
    <div id="myPadding">DESN3201</div>
</body>

</html>
