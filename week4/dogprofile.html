<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/css.css" />
    <title>Dog profile</title>
</head>

<body>
    <header>
        <h1>My dog max</h1>
        <style>
            h1{
                color: blue;
            }
            .info{
                color:green;
            }
            #sub-title{
                text-decoration: underline;
                font-style:normal;
                font-weight: bold;
            }
            li{
                color: red;
                font-style: italic;
            }
        
        </style>
    </header>
 
    <div>        
        <h5 class="info">Hello there! I am max.</h5>
        <div id="dog-image" style="padding: 15px;">
            <img src="./img/img1.png"  alt="max the dog" />
         </div>
    </div>
    <div>
        <h4 id="sub-title">Max's food:</h4>
        <ul>
            <li>Meatloaf</li>
            <li>Bone</li>
            <li>Meat</li>
        </ul>
        <p class="info">Find more on google <a href="https://www.google.com/" target="_blank" >Go to google</a></p>
    </div>
    
        
 

</body>

</html>
